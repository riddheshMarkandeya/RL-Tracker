<!doctype html>
<!--
  PROTOTYPE — throwaway, never merge. Branch: prototype/period-views (branched from prototype/recap-layout).
  Plan: 3 variants of a separate "Trends" page for periods, in one standalone file, via ?variant=A|B|C (←/→ or the bottom bar).
  Question (wayfinder ticket "Period views and trends"): how the day / week / month / season / YTD / rolling views
  differ from the recap, which trend charts belong on them, and how you move between periods.
  All data is mock and in-memory (2026-01-01 → 2026-10-16, ~1,000 matches). The playlist filter really filters.

  Design contract
  - Job: "how am I doing over this stretch, and is it getting better?" — a few headline numbers and trend lines, not every stat.
  - Primary action: pick a period; secondary: pick which metric to look at, drill into a day's recap.
  - States: populated, empty (Playlist = Private), current period still running (future days empty), no previous period (YTD, S22).
  - Responsive: 320 / 768 / 1024 / 1440. Reject: rank/MMR art (out of v1), dual-axis charts, a chart for every stat.
  - Look: the recap's variant D in the carbon theme (scorebug, Barlow Condensed numbers, D's tiles and tables).
  - Charts: single series in the accent colour; previous period as a dashed muted ghost (legend + direct label);
    win/loss bars always carry W/L axis letters (the W/L pair is only CVD-safe with a secondary cue).
  Variants:
  A · Tabs + small multiples — period tabs with ‹ › stepping, scorebug, per-game vs previous, a grid of small trend charts.
  B · Timeline + one big chart — click months/seasons on a year strip; metric tiles pick what the big chart shows; date or rolling-by-match x-axis.
  C · Calendar + drill-down table — a year calendar as the map, breadcrumb navigation, a table of sub-periods you click into.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trends prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --page:#0f1218; --surf:#171b23; --surf2:#1f2430; --line:#2a303c; --grid:#262c38;
  --ink:#e8eaf0; --ink2:#a8afbf; --muted:#7f8798;
  --blue:#3987e5; --orange:#d95926;
  --win:#2ca57a; --loss:#b84a63; --up:#4cc38a; --down:#e88394; --flag:#e0a63a;
  --r:6px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --accent:#9db7ff;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme=carbon]{--page:#0c0c0d;--surf:#161618;--surf2:#202023;--line:#2c2c30;--grid:#252528;--ink:#ededed;--ink2:#b0b0b5;--muted:#85858c;--accent:#c6f24e}
:root[data-theme=daylight]{color-scheme:light;--page:#f3f4f6;--surf:#fff;--surf2:#eceef2;--line:#d8dbe2;--grid:#e6e8ed;--ink:#14171c;--ink2:#4a5160;--muted:#687083;--accent:#4f46e5;--up:#1d7f55;--down:#bd3557;--flag:#a96c12}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-size:14px;line-height:1.45;padding-bottom:80px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .up{color:var(--up)} .down{color:var(--down)}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 var(--s3);font-weight:600}
h2.sec{margin:var(--s5) 0 var(--s3)}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);min-width:0;overflow-x:auto}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--s4)}
.empty{padding:var(--s6);text-align:center;color:var(--ink2)}
.ico{width:18px;height:18px;object-fit:contain;vertical-align:middle}
.tip{position:fixed;pointer-events:none;background:#0b0d12;color:#ededed;border:1px solid #2c2c30;border-radius:4px;padding:6px 8px;font-size:12px;z-index:50;max-width:260px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
table{border-collapse:collapse;width:100%}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}

/* header (same as the recap) + page nav */
header{border-bottom:1px solid var(--line);background:var(--surf)}
.hdr{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;padding:var(--s3) var(--s4) 0;max-width:1200px;margin:0 auto}
.brand{font-weight:700;letter-spacing:.02em}
.status{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block}
.topnav{display:flex;gap:var(--s4);margin-right:auto;margin-left:var(--s5)}
.topnav a{color:var(--ink2);text-decoration:none;font-weight:600;padding:6px 2px 8px;border-bottom:2px solid transparent}
.topnav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.topnav a:hover{color:var(--ink)}
.bar2{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;padding:var(--s3) var(--s4);max-width:1200px;margin:0 auto;border-top:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:var(--s3)}
.filters label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.filters select{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px}

/* A: segmented period tabs + stepper */
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.seg button{background:none;border:0;border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--ink2);font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--page)}
.seg button:hover:not([aria-pressed=true]){color:var(--ink)}
.pnav{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3)}
.step{display:flex;align-items:center;gap:var(--s2)}
.step button{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;cursor:pointer}
.step button:disabled{opacity:.35;cursor:default}
.step b{min-width:120px;text-align:center}

/* scorebug, from the recap's variant D */
.bug{display:grid;grid-template-columns:1fr auto 1fr;max-width:780px;margin:var(--s5) auto 0;font-family:"Barlow Condensed",Inter,sans-serif}
.bug-side{display:flex;align-items:center;justify-content:flex-end;gap:var(--s4);background:var(--surf2);padding:0 var(--s5);transform:skewX(-12deg);border-bottom:4px solid var(--win)}
.bug-side.r{justify-content:flex-start;border-bottom-color:var(--loss)}
.bug-side>*{transform:skewX(12deg)}
.bug-side span{font-weight:700;letter-spacing:.12em;color:var(--ink2);font-size:18px}
.bug-side b{font-size:88px;font-style:italic;font-weight:800;line-height:1.05}
.bug-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent);color:var(--page);padding:var(--s2) var(--s5);font-weight:700;letter-spacing:.08em;font-size:14px;z-index:1;text-align:center}
.bug-mid b{font-size:30px;font-style:italic;font-weight:800;letter-spacing:.04em;line-height:1.1}
.bug-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4)}
.bug-stats>div{min-width:120px;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px 16px;font-family:"Barlow Condensed",Inter,sans-serif;text-align:center}
.bug-stats b{display:flex;align-items:center;justify-content:center;gap:6px;font-size:30px;font-style:italic;font-weight:800;line-height:1.1}
.bug-stats b small{font-size:16px;font-style:normal;font-weight:600}
.bug-stats span{display:block;font-size:13px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.bug-stats .ico{width:26px;height:26px}
@media (max-width:640px){.bug-side b{font-size:56px}.bug-side{padding:0 var(--s3)}.bug-side span{font-size:13px}.bug-mid{padding:var(--s2)}.bug-mid b{font-size:22px}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.tile .v{font-size:24px;font-weight:600}
.tile .lbl{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .d{font-size:12px}

/* charts */
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--muted);font-size:11px;font-family:Inter,system-ui,sans-serif}
svg.ch .gl{stroke:var(--grid)}
svg.ch .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .gh{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
svg.ch .avg{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 3}
svg.ch .pt{fill:var(--accent);stroke:var(--surf);stroke-width:2}
svg.ch .pt.thin{fill:var(--surf);stroke:var(--accent);stroke-width:1.5}
svg.ch .mk{stroke:var(--muted);stroke-dasharray:3 3}
svg.ch .hit rect.h{fill:transparent}
svg.ch .hit line{stroke:var(--ink2);opacity:0}
svg.ch .hit:hover line{opacity:.6}
svg.ch .hit:hover rect.h{fill:var(--ink);fill-opacity:.04}
svg.ch .bw{fill:var(--win)} svg.ch .bl{fill:var(--loss)}
.ckey{display:flex;flex-wrap:wrap;gap:var(--s4);font-size:12px;color:var(--ink2);margin-top:var(--s2)}
.ckey span{display:inline-flex;align-items:center;gap:6px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s3)}
.tgrid .wide{grid-column:1/-1}
.tgrid .panel h2{display:flex;justify-content:space-between;gap:8px}
.tgrid .panel h2 span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s5)}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.list{display:grid}
.list>*{display:grid;grid-template-columns:1fr auto;gap:var(--s3);padding:8px 0;border-bottom:1px solid var(--grid);align-items:center}
.list a{color:inherit;text-decoration:none} .list a:hover{background:var(--surf2)}
.wls{display:inline-flex;flex-wrap:wrap;gap:2px;vertical-align:middle}
.wls i{width:8px;height:8px;border-radius:2px;background:var(--loss)} .wls i.W{background:var(--win)}
.wl{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font-weight:700;font-size:11px;color:#fff}
.wl.W{background:var(--win)} .wl.L{background:var(--loss)}

/* B: year timeline + metric tiles */
.tlw{overflow-x:auto}
.tl{position:relative;min-width:720px;height:96px}
.tl button{position:absolute;border:1px solid var(--line);background:var(--surf);color:var(--ink2);cursor:pointer;font-size:12px;border-radius:3px;padding:0 6px;text-align:left;overflow:hidden;white-space:nowrap}
.tl button:hover{border-color:var(--muted);color:var(--ink)}
.tl button[aria-pressed=true]{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tl .sea{top:0;height:24px;font-weight:700;letter-spacing:.06em}
.tl .mon{top:28px;height:28px}
.tl .day{top:60px;height:22px;padding:0;min-width:0;border-radius:1px;border:0}
.tl .sel{position:absolute;top:-4px;bottom:0;background:var(--accent);opacity:.12;border-radius:3px;pointer-events:none}
.tl .now{position:absolute;top:-4px;bottom:0;border-left:2px solid var(--ink2)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;color:var(--ink2);font-weight:600}
.presets button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--page)}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s4);margin-top:var(--s5)}
.phead .t{font-family:"Barlow Condensed",Inter,sans-serif;font-size:40px;font-style:italic;font-weight:800;line-height:1}
.phead .rec{font-family:"Barlow Condensed",Inter,sans-serif;font-size:28px;font-weight:700}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2);margin-top:var(--s4)}
.mtile{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);text-align:left;cursor:pointer;display:grid;gap:2px}
.mtile:hover{border-color:var(--muted)}
.mtile[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.mtile .lbl{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.mtile .v{font-size:22px;font-weight:600}
.mtile .d{font-size:12px}
.mtile svg{width:100%;height:24px}
.mtile svg path{fill:none;stroke:var(--accent);stroke-width:1.5}
.xmode{display:flex;gap:2px;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.xmode button{background:none;border:0;border-radius:4px;padding:2px 10px;cursor:pointer;color:var(--ink2);font-size:12px;font-weight:600}
.xmode button[aria-pressed=true]{background:var(--surf);color:var(--ink)}
.bighead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.bighead h2{margin:0}

/* C: breadcrumb, calendar, drill table */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.crumbs button{background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--ink2);font-weight:600;border-radius:4px}
.crumbs button:hover{color:var(--ink);background:var(--surf2)}
.crumbs b{padding:2px 4px}
.crumbs i{color:var(--muted);font-style:normal}
.cal{overflow-x:auto}
.cal svg{display:block}
.cal rect.c{rx:2px;cursor:pointer}
.cal rect.c:hover{stroke:var(--ink);stroke-width:1.5}
.cal text{fill:var(--muted);font-size:10px;font-family:Inter,system-ui,sans-serif}
.dt tbody tr{cursor:pointer} .dt tbody tr:hover{background:var(--surf2)}
.dt td:first-child{font-weight:600}
.dt .bar{display:inline-block;vertical-align:middle;width:60px;height:8px;background:var(--surf2);border-radius:2px;position:relative;margin-left:8px}
.dt .bar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.dt .bar::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--muted)}
.dt tfoot td{font-weight:700;border-top:2px solid var(--line)}
.gtog{display:inline-flex;gap:2px;margin-left:var(--s3);vertical-align:middle}
.gtog button{background:var(--surf2);border:1px solid var(--line);border-radius:4px;padding:1px 8px;cursor:pointer;font-size:11px;color:var(--ink2);text-transform:none;letter-spacing:0}
.gtog button[aria-pressed=true]{border-color:var(--accent);color:var(--ink)}
.hl{display:flex;flex-wrap:wrap;gap:var(--s5);align-items:baseline;margin:var(--s5) 0 var(--s4)}
.hl .big{font-family:"Barlow Condensed",Inter,sans-serif;font-size:56px;font-style:italic;font-weight:800;line-height:1}
.hl .big i{font-style:inherit;color:var(--muted);font-size:36px}
.hl div span{display:block;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.hl div b{font-size:22px}

/* variant switcher — deliberately unlike the design under review */
#vbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:8px;
  background:#fff;color:#111;border-radius:999px;padding:6px 8px;font:600 13px/1 ui-monospace,Consolas,monospace;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#vbar button{border:0;background:#111;color:#fff;border-radius:999px;width:28px;height:28px;cursor:pointer;font:inherit}
#vbar span{min-width:250px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <span class="brand">RL Tracker</span>
    <nav class="topnav" aria-label="Pages">
      <a href="../recap-layout/recap-prototype.html?variant=D&amp;theme=carbon" data-tip="Opens the recap prototype (its own mock data)">Recap</a>
      <a href="#" aria-current="page">Trends</a>
    </nav>
    <span class="status" role="status"><i></i>connected · waiting for match</span>
  </div>
  <div class="bar2">
    <div id="pbar"></div>
    <div class="filters">
      <label>Playlist <select id="fPl"></select></label>
      <label>With teammate <select id="fTm"></select></label>
    </div>
  </div>
</header>
<main id="app"></main>
<div class="tip" id="tip"></div>
<div id="vbar" aria-label="Prototype variant switcher">
  <button type="button" id="vprev" aria-label="Previous variant">←</button>
  <span id="vlabel"></span>
  <button type="button" id="vnext" aria-label="Next variant">→</button>
  <select id="vtheme" aria-label="Theme" style="height:30px;border-radius:999px;border:1px solid #ccc;padding:0 8px;background:#fff;color:#111">
    <option value="carbon">theme: carbon</option><option value="daylight">theme: daylight</option></select>
</div>

<script>
// ---------------- dates ----------------
const ICON = n => `../recap-layout/assets/icons/stat_events/${n}.png`;
const RECAP = '../recap-layout/recap-prototype.html?variant=D&theme=carbon';
const addD = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const monday = d => addD(d, -((d.getDay()+6)%7));
const fmtD = d => d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtDW = d => d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(',','');
const monName = d => d.toLocaleDateString('en-GB',{month:'long'});
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())), wd=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-wd); return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7); }
const YEAR0 = new Date(2026,0,1), NOW = new Date(2026,9,16), TOMORROW = addD(NOW,1);
// Seasons table (seeded per Q9); each runs until the next one starts.
const SEASONS = [{n:22,start:new Date(2026,2,11)},{n:23,start:new Date(2026,5,9)},{n:24,start:new Date(2026,8,23)}];
SEASONS.forEach((s,i)=>s.end = SEASONS[i+1]?.start || TOMORROW);

// ---------------- mock matches ----------------
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PLS = [['Ranked Doubles',.5],['Ranked Duel',.14],['Ranked Standard',.1],['Casual Doubles',.12],['Casual Duel',.06],['Casual Standard',.05],['Hoops',.03]];
const pickPl = () => { let r=rnd(); for(const [p,w] of PLS){ if((r-=w)<=0) return p; } return PLS[0][0]; };
const hm = mins => String(Math.floor(mins/60)%24).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
const ALL = [];
for(let d=YEAR0, i=0; d<=NOW; d=addD(d,1), i++){
  if(rnd() > (d.getDay()%6===0 ? .75 : .5)) continue;          // weekends a bit busier
  const nS = rnd()<.15 ? 2 : 1;
  for(let s=0; s<nS; s++){
    const n = 2+Math.floor(rnd()*9), start = (s ? 14 : 19+Math.floor(rnd()*3))*60;
    const skill = .47 + .07*Math.sin(i/21) + .06*i/290;        // slow drift so trends have a shape
    for(let k=0; k<n; k++){
      const form = skill + (rnd()-.5)*.3, pl = pickPl(), duel = pl==='Ranked Duel';
      const res = rnd()<form ? 'W' : 'L';
      const sh = Math.max(0, Math.round(1+form*3+rnd()*3+(duel?2:0)));
      const g = Math.min(sh, Math.round(sh*(.2+form*.35)*(rnd()+.5)));
      const a = duel ? 0 : Math.round(rnd()*form*2.4), sv = Math.round(rnd()*(duel?4:3)), dm = rnd()<.3 ? 1+Math.round(rnd()) : 0;
      ALL.push({d, day:+d, sess:`${+d}-${s}`, t:hm(start+k*9), pl, ranked:pl.startsWith('Ranked'), res, g, a, sv, sh, dm,
        score: Math.round(110+g*100+a*50+sv*50+sh*20+rnd()*120), mvp: res==='W' && rnd()<.45});
    }
  }
}

// Teammates on a separate rng so adding them didn't reshuffle the matches. Friends play some nights, not others.
let seed2 = 5; const rnd2 = () => (seed2 = (seed2 * 16807) % 2147483647) / 2147483647;
const FRIENDS = ['kayto','mmmilo'], nightWith = {};
ALL.forEach(m=>{ const k=m.sess; nightWith[k] ??= rnd2()<.35 ? 'kayto' : rnd2()<.25 ? 'mmmilo' : '';
  m.tm = m.pl==='Ranked Duel' ? '' : (nightWith[k] && rnd2()<.85 ? nightWith[k] : 'random');
  m.left = m.res==='L' && rnd2()<.06; });

// ---------------- state & derived ----------------
const P = new URLSearchParams(location.search);
const state = {tm:'', kind:P.get('period')||'l30', off:+(P.get('off')||0), metric:P.get('metric')||'win', xmode:'auto', pl:'ranked',
               lvl:null, group:'season'};
let FM = ALL;
function applyFilter(){
  FM = ALL.filter(m => state.pl==='private' ? false : state.pl==='all' ? true : state.pl==='ranked' ? m.ranked
    : state.pl==='casual' ? m.pl.startsWith('Casual') : m.pl===state.pl).filter(m => !state.tm || m.tm===state.tm);
}
const PL_GROUPS = [['Ranked',['Ranked Duel','Ranked Doubles','Ranked Standard','Ranked Quads'],'ranked','All ranked'],
  ['Casual',['Casual Duel','Casual Doubles','Casual Standard','Casual Quads'],'casual','All casual'],
  ['Extra modes',['Hoops','Rumble','Dropshot','Snow Day','Heatseeker'],null,null]];
const PL_SIZE = {Duel:'1v1',Doubles:'2v2',Standard:'3v3',Quads:'4v4'};
function playlistUI(from, to){
  const sel=document.getElementById('fPl'), cnt={};
  ALL.forEach(m=>{ if(m.d>=from && m.d<to) cnt[m.pl]=(cnt[m.pl]||0)+1; });
  const opt=(v,l)=>`<option value="${v}">${l}</option>`;
  const nm=pl=>{ const sz=PL_SIZE[pl.split(' ')[1]]; return sz?`${pl.split(' ')[0]} ${sz}`:pl; };
  sel.innerHTML = opt('all','Everything (excl. private)', Object.values(cnt).reduce((a,b)=>a+b,0))
    + PL_GROUPS.map(([g,list,allV,allL])=>{ const seen=list.filter(pl=>cnt[pl]); if(!seen.length) return '';
        const tot=seen.reduce((a,pl)=>a+cnt[pl],0);
        return `<optgroup label="${g}">${allV?opt(allV,allL,tot):''}${seen.map(pl=>opt(pl,nm(pl),cnt[pl])).join('')}</optgroup>`; }).join('')
    + opt('private','Private matches');
  if(![...sel.options].some(o=>o.value===state.pl)) state.pl='ranked';   // Trends default: all ranked
  sel.value=state.pl;
}
// friends only, with how many matches you played with each this period (all of 2026 for the C calendar)
function teammateUI(from, to){
  const sel=document.getElementById('fTm'), cnt={};
  ALL.forEach(m=>{ if(m.d>=from && m.d<to && FRIENDS.includes(m.tm)) cnt[m.tm]=(cnt[m.tm]||0)+1; });
  sel.innerHTML = `<option value="">Anyone</option>`+FRIENDS.map(n=>`<option value="${n}">${n} ★</option>`).join('');
  sel.value=state.tm;
}
const inRange = (from,to) => FM.filter(m => m.d>=from && m.d<to);

function agg(ms){
  const n=ms.length, w=ms.filter(m=>m.res==='W').length, T={};
  ['g','a','sv','sh','dm','score'].forEach(k=>T[k]=ms.reduce((s,m)=>s+m[k],0));
  let best=0, run=0; ms.forEach(m=>{ run = m.res==='W' ? run+1 : 0; best=Math.max(best,run); });
  return {n, w, l:n-w, winPct:n?100*w/n:null, T, per:k=>n?T[k]/n:null, shootPct:T.sh?100*T.g/T.sh:null,
          mvp:ms.filter(m=>m.mvp).length, best, sess:new Set(ms.map(m=>m.sess)).size, days:new Set(ms.map(m=>m.day)).size};
}
const f2 = v => v==null ? '—' : v.toFixed(2);
const METRICS = [
  {k:'win',  lbl:'Win %',       get:s=>s.winPct,     fmt:v=>Math.round(v)+'%', pts:true, y:[0,100]},
  {k:'score',lbl:'Score / game',get:s=>s.per('score'),fmt:v=>Math.round(v)},
  {k:'g',    lbl:'Goals / game',get:s=>s.per('g'),   fmt:f2, ic:'Goal'},
  {k:'a',    lbl:'Assists / game',get:s=>s.per('a'), fmt:f2, ic:'Assist'},
  {k:'sv',   lbl:'Saves / game',get:s=>s.per('sv'),  fmt:f2, ic:'Save'},
  {k:'sh',   lbl:'Shots / game',get:s=>s.per('sh'),  fmt:f2, ic:'Shot'},
  {k:'shoot',lbl:'Shooting %',  get:s=>s.shootPct,   fmt:v=>Math.round(v)+'%', pts:true},
  {k:'dm',   lbl:'Demos / game',get:s=>s.per('dm'),  fmt:f2, ic:'Demolition'},
];
const MK = k => METRICS.find(m=>m.k===k);
// change vs the previous period: percentage points for rates, percent for per-game numbers
function dlt(m, cur, prev, vsTxt){
  const a=m.get(cur), b=prev&&prev.n?m.get(prev):null;
  if(a==null) return '<span class="muted">—</span>';
  if(b==null) return '<span class="muted">&nbsp;</span>';   // said once in the period header instead
  const d = m.pts ? a-b : (b ? 100*(a-b)/b : 0);
  if(Math.abs(d)<(m.pts?1:3)) return `<span class="muted">≈ ${vsTxt}</span>`;
  return `<span class="${d>0?'up':'down'}" data-tip="${m.fmt(a)} now vs ${m.fmt(b)}">${d>0?'▲':'▼'} ${Math.abs(Math.round(d))}${m.pts?' pts':'%'}</span> <span class="muted">vs ${vsTxt}</span>`;
}

// ---------------- periods ----------------
// kind: l7 | l30 | week | month | season | ytd. off counts back from the current one (0 = current).
const LIMIT = {week: Math.floor((monday(NOW)-monday(YEAR0))/(7*864e5)), month: NOW.getMonth(), season: SEASONS.length-1};
function period(kind, off=0){
  let p;
  if(kind==='l7'||kind==='l30'){ const n=kind==='l7'?7:30, from=addD(TOMORROW,-n);
    p={label:`Last ${n} days`, from, end:TOMORROW, prev:[addD(from,-n),from], vs:`previous ${n} days`, bucket:'day'}; }
  if(kind==='week'){ const from=addD(monday(NOW),-7*off);
    p={label: off===0?'This week':off===1?'Last week':`Week ${isoWeek(from)}`, from, end:addD(from,7), prev:[addD(from,-7),from],
       vs: off===0?'last week':'the week before', bucket:'day'}; }
  if(kind==='month'){ const from=new Date(2026,NOW.getMonth()-off,1), pm=new Date(2026,from.getMonth()-1,1);
    p={label:monName(from)+' 2026', from, end:new Date(2026,from.getMonth()+1,1), prev: pm>=YEAR0?[pm,from]:null, vs:monName(pm), bucket:'day'}; }
  if(kind==='season'){ const i=SEASONS.length-1-off, s=SEASONS[i], ps=SEASONS[i-1];
    p={label:`Season ${s.n}`, from:s.start, end:s.end, prev: ps?[ps.start,ps.end]:null, vs:ps?`Season ${ps.n}`:'', bucket:'week', sea:s}; }
  if(kind==='ytd') p={label:'This year', from:YEAR0, end:TOMORROW, prev:null, vs:'2025', bucket:'week'};
  // all time plots months: weekly points get crowded after a couple of years
  if(kind==='all') p={label:'All time', from:new Date(Math.min(...ALL.map(m=>m.day))), end:TOMORROW, prev:null, vs:'', bucket:'month'};
  p.kind=kind; p.off=off; p.to = p.end>TOMORROW ? TOMORROW : p.end;   // end = axis, to = data (current period still running)
  p.running = p.end>TOMORROW || p.end.getTime()===TOMORROW.getTime();
  p.range = `${fmtD(p.from)} – ${fmtD(addD(p.to,-1))}`;
  return p;
}
function buckets(p, ms, kind=p.bucket){
  const out=[];
  if(kind==='day') for(let d=p.from; d<p.end; d=addD(d,1)) out.push({from:d, to:addD(d,1), label:fmtDW(d), short:fmtD(d)});
  if(kind==='week') for(let d=monday(p.from); d<p.end; d=addD(d,7)) out.push({from:d<p.from?p.from:d, to:addD(d,7)>p.end?p.end:addD(d,7), label:`Week ${isoWeek(d)} · from ${fmtD(d<p.from?p.from:d)}`, short:fmtD(d<p.from?p.from:d)});
  if(kind==='month') for(let d=new Date(p.from.getFullYear(),p.from.getMonth(),1); d<p.end; d=new Date(d.getFullYear(),d.getMonth()+1,1)) out.push({from:d<p.from?p.from:d, to:new Date(d.getFullYear(),d.getMonth()+1,1), label:monName(d)+' '+d.getFullYear(), short:monName(d).slice(0,3)});
  out.forEach(b=>{ b.ms=ms.filter(m=>m.d>=b.from && m.d<b.to); b.s=agg(b.ms); });
  return out;
}
const seasonMarks = (p, bs) => SEASONS.filter(s=>s.start>p.from && s.start<p.end).map(s=>({i:bs.findIndex(b=>s.start>=b.from&&s.start<b.to), label:'S'+s.n}));

// ---------------- charts ----------------
// One series line chart. pts = [{label, s}] ; ghost = previous period's values by index (dashed, muted).
function lineChart(pts, m, {W=360, H=130, ghost=null, marks=[], avg=null, maxDots=60}={}){
  const vals = pts.map(p=>p.s.n ? m.get(p.s) : null), have = vals.filter(v=>v!=null), gv=(ghost||[]).filter(v=>v!=null);
  if(!have.length) return `<p class="muted">No matches in this period.</p>`;
  const pad={l:36,r:10,t:10,b:22}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  let [lo,hi] = m.y || (()=>{ const all=have.concat(gv); let a=Math.min(...all), b=Math.max(...all); const sp=(b-a)||Math.abs(b)||1; return [Math.max(0,a-sp*.15), b+sp*.15]; })();
  const x = i => pad.l + (pts.length<2 ? iw/2 : i*iw/(pts.length-1)), y = v => pad.t + ih - (v-lo)/(hi-lo)*ih;
  const path = arr => arr.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean).map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const ticks=[lo,(lo+hi)/2,hi];
  const grid = ticks.map(t=>`<line class="gl" x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${pad.l-6}" y="${y(t)+4}" text-anchor="end">${m.fmt(t)}</text>`).join('');
  const xl = [0, Math.floor((pts.length-1)/2), pts.length-1].filter((v,i,a)=>a.indexOf(v)===i)
    .map((i,j,a)=>`<text x="${x(i)}" y="${H-6}" text-anchor="${j===0&&a.length>1?'start':j===a.length-1&&a.length>1?'end':'middle'}">${pts[i].short||''}</text>`).join('');
  const av = avg!=null ? `<line class="avg" x1="${pad.l}" x2="${W-pad.r}" y1="${y(avg)}" y2="${y(avg)}"/><text x="${pad.l+4}" y="${y(avg)-4}">avg ${m.fmt(avg)}</text>` : '';
  const mk = marks.filter(k=>k.i>=0).map(k=>`<line class="mk" x1="${x(k.i)}" x2="${x(k.i)}" y1="${pad.t}" y2="${pad.t+ih}"/><text x="${x(k.i)+3}" y="${pad.t+10}">${k.label}</text>`).join('');
  const dots = pts.length<=maxDots ? vals.map((v,i)=>v==null?'':`<circle class="pt${pts[i].s.n<3?' thin':''}" cx="${x(i)}" cy="${y(v)}" r="${pts[i].s.n<3?3:3.5}"/>`).join('') : '';
  const cw = pts.length<2 ? iw : iw/(pts.length-1);
  const hits = pts.map((p,i)=>`<g class="hit" data-tip="${p.label}: ${vals[i]==null?'no matches':m.fmt(vals[i])+' · '+p.s.n+' match'+(p.s.n===1?'':'es')+(p.s.n<3?' (few — hollow dot)':'')}${ghost&&ghost[i]!=null?' · previous '+m.fmt(ghost[i]):''}">
      <rect class="h" x="${x(i)-cw/2}" y="${pad.t}" width="${cw}" height="${ih}"/><line x1="${x(i)}" x2="${x(i)}" y1="${pad.t}" y2="${pad.t+ih}"/></g>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.lbl} over time">${grid}${xl}${av}${mk}
    ${ghost?`<path class="gh" d="${path(ghost)}"/>`:''}<path class="ln" d="${path(vals)}"/>${dots}${hits}</svg>`;
}
// Wins up, losses down, per bucket. W/L letters on the axis so it never relies on colour alone.
function wlChart(pts, {W=1000, H=120, marks=[], open=null}={}){
  const pad={l:22,r:6,t:6,b:20}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, mid=pad.t+ih/2;
  const max=Math.max(1,...pts.map(p=>Math.max(p.s.w,p.s.l))), bw=iw/pts.length, sc=v=>v/max*(ih/2-2);
  const bars = pts.map((p,i)=>{ const bx=pad.l+i*bw+1, w=Math.max(1,bw-2);
    return `<g class="hit" ${open&&p.s.n?open(p)+' style="cursor:pointer"':''} data-tip="${p.label}: ${p.s.n?p.s.w+'–'+p.s.l+(open?' · click to open':''):'no matches'}"><rect class="h" x="${pad.l+i*bw}" y="${pad.t}" width="${bw}" height="${ih}"/>
      ${p.s.w?`<rect class="bw" x="${bx}" y="${mid-1-sc(p.s.w)}" width="${w}" height="${sc(p.s.w)}" rx="${Math.min(2,w/2)}"/>`:''}
      ${p.s.l?`<rect class="bl" x="${bx}" y="${mid+1}" width="${w}" height="${sc(p.s.l)}" rx="${Math.min(2,w/2)}"/>`:''}</g>`; }).join('');
  const mk = marks.filter(k=>k.i>=0).map(k=>`<line class="mk" x1="${pad.l+k.i*bw}" x2="${pad.l+k.i*bw}" y1="${pad.t}" y2="${pad.t+ih}"/><text x="${pad.l+k.i*bw+3}" y="${pad.t+10}">${k.label}</text>`).join('');
  const xl = [0, pts.length-1].map((i,j)=>`<text x="${pad.l+i*bw+(j?bw:0)}" y="${H-6}" text-anchor="${j?'end':'start'}">${pts[i].short}</text>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wins and losses per ${pts.length>40?'day':'bucket'}">
    <line class="gl" x1="${pad.l}" x2="${W-pad.r}" y1="${mid}" y2="${mid}"/><text x="4" y="${pad.t+12}">W</text><text x="4" y="${pad.t+ih-2}">L</text>${mk}${bars}${xl}</svg>`;
}
const spark = (pts, m) => { const v=pts.map(p=>p.s.n?m.get(p.s):null), h=v.filter(x=>x!=null); if(h.length<2) return '<svg></svg>';
  const lo=Math.min(...h), hi=Math.max(...h)||1, sp=(hi-lo)||1;
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="${v.map((x,i)=>x==null?null:[i*100/(v.length-1),22-(x-lo)/sp*20]).filter(Boolean).map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('')}"/></svg>`; };
// Rolling window over matches (x = match number), for the "by match" axis.
// Pulls in the matches just before the period, so the first points are full windows rather than jumpy.
function rolling(ms, n=20, before=[]){ const all=before.slice(-(n-1)).concat(ms), k=all.length-ms.length, out=[];
  for(let i=0; i<ms.length; i++){ const j=k+i, win=all.slice(Math.max(0,j-n+1),j+1);
    if(win.length<Math.min(n,all.length)) continue;
    out.push({label:`Match ${i+1} · ${fmtD(ms[i].d)} · last ${win.length} matches${j-win.length+1<k?' (reaches before this period)':''}`, short:fmtD(ms[i].d), s:agg(win)}); }
  return out; }

// ---------------- shared bits ----------------
const empty = () => `<div class="panel empty" style="margin-top:24px">No matches in this period with these filters.<br><span class="muted">Private matches are kept out of overall stats.</span></div>`;
function scorebug(p, s, prev){
  const win=MK('win'), sh=MK('shoot');
  return `<div class="bug" role="img" aria-label="${s.w} wins, ${s.l} losses">
    <div class="bug-side"><span>WINS</span><b class="num">${s.w}</b></div>
    <div class="bug-mid"><span>${p.label.toUpperCase()}</span><b>${Math.round(s.winPct)}%</b><span>${p.range.toUpperCase()} · ${s.n} MATCHES</span></div>
    <div class="bug-side r"><b class="num">${s.l}</b><span>LOSSES</span></div></div>
    <div style="text-align:center;margin-top:var(--s3)">${dlt(win,s,prev,p.vs)}${!p.prev?'<span class="muted">nothing earlier to compare with</span>':''}${p.running&&!p.kind.startsWith('l')?' <span class="muted">· still running</span>':''}</div>
    <div class="bug-stats">
      <div><b class="num">${s.sess}</b><span>Sessions · ${s.days} days</span></div>
      <div><b class="num">W${s.best}</b><span>Best streak</span></div>
      <div><b class="num">${Math.round(s.shootPct)}%</b><span>Shooting</span></div>
      <div><b class="num"><img class="ico" src="${ICON('MVP')}" alt="">×${s.mvp}</b><span>MVPs</span></div></div>`;
}
function sessionsList(ms, max=8){
  const by={}; ms.forEach(m=>(by[m.sess] ??= []).push(m));
  const list=Object.values(by).reverse();
  return `<div class="list">${list.slice(0,max).map(x=>{ const w=x.filter(m=>m.res==='W').length;
    return `<a href="${RECAP}" data-tip="Opens this session's recap (prototype: the recap's own mock session)"><span><b>${fmtDW(x[0].d)}</b> <span class="muted">${x[0].t}</span><br><span class="wls">${x.slice(0,24).map(m=>`<i class="${m.res}"></i>`).join('')}</span></span><span class="num">${w}–${x.length-w} →</span></a>`; }).join('')}</div>
    ${list.length>max?`<p class="muted" style="font-size:12px">+ ${list.length-max} older sessions · all of them are in the recap's session picker</p>`:''}`;
}
const byPl = ms => { const b={}; ms.forEach(m=>{ const x=b[m.pl]??={pl:m.pl,w:0,n:0,g:0}; x.n++; x.g+=m.g; if(m.res==='W') x.w++; });
  return `<table class="num"><thead><tr><th>Playlist</th><th>W–L</th><th>Win %</th><th>Goals/g</th></tr></thead><tbody>${Object.values(b).sort((p,q)=>q.n-p.n).map(x=>`<tr><td>${x.pl}</td><td>${x.w}–${x.n-x.w}</td><td>${Math.round(100*x.w/x.n)}%</td><td>${f2(x.g/x.n)}</td></tr>`).join('')}</tbody></table>`; };

// ---------------- Variant A: tabs + small multiples ----------------
const KINDS = [['l7','Last 7'],['l30','Last 30'],['week','Week'],['month','Month'],['season','Season'],['ytd','Year to date']];
function pbarA(p){
  const step = ['week','month','season'].includes(p.kind);
  return `<div class="pnav"><div class="seg" role="group" aria-label="Period">${KINDS.map(([k,l])=>`<button type="button" data-kind="${k}" aria-pressed="${k===p.kind}">${l}</button>`).join('')}</div>
    ${step?`<div class="step"><button type="button" data-off="${p.off+1}" ${p.off>=LIMIT[p.kind]?'disabled':''} aria-label="Earlier">‹</button><b>${p.label}</b><button type="button" data-off="${p.off-1}" ${p.off<=0?'disabled':''} aria-label="Later">›</button></div>`:''}</div>`;
}
function VariantA(){
  const p=period(state.kind,state.off); document.getElementById('pbar').innerHTML=pbarA(p);
  const ms=inRange(p.from,p.to); if(!ms.length) return `<div class="wrap">${empty()}</div>`;
  const s=agg(ms), prev=p.prev?agg(inRange(...p.prev)):null, bs=buckets(p,ms), marks=seasonMarks(p,bs);
  const show=['win','g','sv','shoot','a','score'];
  return `<div class="wrap">${scorebug(p,s,prev)}
    <h2 class="sec">Per game · vs ${p.vs||'—'}</h2>
    <div class="tiles">${METRICS.filter(m=>m.k!=='win').map(m=>`<div class="panel tile"><div class="lbl">${m.ic?`<img class="ico" src="${ICON(m.ic)}" alt="">`:''}${m.lbl}</div><div class="v num">${m.fmt(m.get(s))}</div><div class="d">${dlt(m,s,prev,p.vs)}</div></div>`).join('')}</div>
    <h2 class="sec">Trends · per ${p.bucket}</h2>
    <div class="tgrid">
      <div class="panel wide"><h2>Wins and losses <span>per ${p.bucket}</span></h2>${wlChart(bs,{marks})}</div>
      ${show.map(k=>{ const m=MK(k); return `<div class="panel"><h2>${m.lbl} <span>${m.fmt(m.get(s))} over the period</span></h2>${lineChart(bs,m,{avg:m.get(s),marks})}</div>`; }).join('')}
    </div>
    <div class="ckey"><span><svg width="18" height="8"><line x1="0" x2="18" y1="4" y2="4" stroke="var(--ink2)" stroke-dasharray="2 3"/></svg>period average</span>
      <span><svg width="10" height="10"><circle cx="5" cy="5" r="3" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>under 3 matches that ${p.bucket}</span>
      ${marks.length?'<span>S## = a season starts</span>':''}</div>
    <div class="grid2"><div class="panel"><h2>By playlist</h2>${byPl(ms)}</div><div class="panel"><h2>Sessions</h2>${sessionsList(ms)}</div></div></div>`;
}

// ---------------- Variant B: year timeline + one big chart ----------------
const PRESETS = [['l7',0,'Last 7 days'],['l30',0,'Last 30 days'],['week',0,'This week'],['week',1,'Last week'],['ytd',0,'This year'],['all',0,'All time']];
const B_TILES = ['win','g','sh','shoot','a','sv'];
function timeline(p){
  const span=[YEAR0, new Date(2027,0,1)], pc=d=>100*(d-span[0])/(span[1]-span[0]);
  const box=(cls,from,to,label,attrs,pressed,tip='')=>`<button type="button" class="${cls}" style="left:${pc(from)}%;width:calc(${pc(to)-pc(from)}% - 2px)" ${attrs} aria-pressed="${pressed}" ${tip?`data-tip="${tip}"`:''}>${label}</button>`;
  const months=Array.from({length:12},(_,i)=>{ const f=new Date(2026,i,1), t=new Date(2026,i+1,1), off=NOW.getMonth()-i;
    return off<0 ? `<button type="button" class="mon" disabled style="left:${pc(f)}%;width:calc(${pc(t)-pc(f)}% - 2px);opacity:.35">${monName(f).slice(0,3)}</button>`
      : box('mon',f,t,monName(f).slice(0,3),`data-kind="month" data-off="${off}"`, p.kind==='month'&&p.off===off); }).join('');
  const seas=`<button type="button" class="sea" disabled style="left:0;width:calc(${pc(SEASONS[0].start)}% - 2px);opacity:.5">BEFORE S22</button>`
    + SEASONS.map((s,i)=>box('sea',s.start,s.end,'SEASON '+s.n,`data-kind="season" data-off="${SEASONS.length-1-i}"`, p.kind==='season'&&p.off===SEASONS.length-1-i)).join('');
  // one thin cell per played day; height of colour = activity, just enough to show where you played
  const days={}; FM.forEach(m=>{ const k=m.day; days[k]=(days[k]||0)+1; });
  const dayCells=Object.entries(days).map(([k,n])=>{ const d=new Date(+k); return `<span class="day" style="position:absolute;top:${60+22-Math.min(22,4+n*2)}px;height:${Math.min(22,4+n*2)}px;left:${pc(d)}%;width:2px;background:var(--muted)"></span>`; }).join('');
  // year stepper: the mock only has 2026; in a real install earlier years page in here
  return `<div class="step" style="margin-top:var(--s4)"><button type="button" disabled aria-label="Earlier year" data-tip="Earlier years appear here (the mock only has 2026)">‹</button><b style="min-width:60px">2026</b><button type="button" disabled aria-label="Later year">›</button></div>
    <div class="tlw" style="margin-top:var(--s2)"><div class="tl" aria-label="Pick a month or season">${seas}${months}${dayCells}
    <div class="sel" style="left:${pc(p.from)}%;width:${Math.max(.4,pc(p.to)-pc(p.from))}%"></div><div class="now" style="left:${pc(TOMORROW)}%" data-tip="Today"></div></div></div>
    <div class="muted" style="font-size:12px;margin-top:4px">Click a season or month. Grey ticks are days you played (taller = more matches).</div>`;
}
function VariantB(){
  const p=period(state.kind,state.off);
  document.getElementById('pbar').innerHTML = `<div class="presets" role="group" aria-label="Quick periods">${PRESETS.map(([k,o,l])=>`<button type="button" data-kind="${k}" data-off="${o}" aria-pressed="${p.kind===k&&p.off===o}">${l}</button>`).join('')}</div>`;
  const ms=inRange(p.from,p.to);
  const head = `<div class="wrap">${timeline(p)}`;
  if(!ms.length) return head+empty()+'</div>';
  const s=agg(ms), prev=p.prev?agg(inRange(...p.prev)):null, bs=buckets(p,ms);
  if(!B_TILES.includes(state.metric)) state.metric='win';
  const m=MK(state.metric);
  // auto: a thin filter (e.g. one friend) leaves a handful of dated points, so fall back to the rolling line
  const withData=bs.filter(b=>b.s.n).length, thin = withData<6 && ms.length>=8;
  const byMatch = state.xmode==='match' || (state.xmode==='auto' && thin);
  const pts = byMatch ? rolling(ms, 20, inRange(new Date(0), p.from)) : bs;
  const step = ['week','month','season'].includes(p.kind);
  const left = ms.filter(x=>x.left).length;
  const open = p.bucket==='day' ? b=>`data-day="${+b.from}"` : p.bucket==='week' ? b=>`data-week="${+monday(b.from)}"` : b=>`data-kind="month" data-off="${NOW.getMonth()-b.from.getMonth()}"`;
  return `${head}
    <div class="phead">${step?`<span class="step"><button type="button" data-off="${p.off+1}" ${p.off>=LIMIT[p.kind]?'disabled':''} aria-label="Earlier ${p.kind}">‹</button>`:''}<span class="t">${p.label}</span>${step?`<button type="button" data-off="${p.off-1}" ${p.off<=0?'disabled':''} aria-label="Later ${p.kind}">›</button></span>`:''}
      <span class="muted">${p.range}${p.running&&!['l7','l30','all'].includes(p.kind)?' · still running':''}${p.prev?' · compared with '+p.vs:''}</span>
      <span class="rec num"><span style="color:var(--win)">${s.w}W</span> – <span style="color:var(--loss)">${s.l}L</span></span>
      <span class="muted">${s.n} matches · ${s.sess} sessions · best streak W${s.best} · <img class="ico" src="${ICON('MVP')}" alt="MVP">×${s.mvp}</span>
      ${left?`<span style="color:var(--flag);font-size:13px" data-tip="Leaving a match counts as a loss, so these pull win % down">⚑ includes ${left} match${left>1?'es':''} you left early</span>`:''}</div>
    <div class="mtiles" role="group" aria-label="Metric to chart">${B_TILES.map(MK).map(x=>`<button type="button" class="mtile" data-metric="${x.k}" aria-pressed="${x.k===m.k}">
      <span class="lbl">${x.ic?`<img class="ico" src="${ICON(x.ic)}" alt="">`:''}${x.lbl}</span><span class="v num">${x.fmt(x.get(s))}</span>
      <span class="d">${p.prev?dlt(x,s,prev,p.vs):'&nbsp;'}</span>${spark(bs,x)}</button>`).join('')}</div>
    <div class="panel" style="margin-top:var(--s3)"><div class="bighead"><h2>${m.lbl} · ${byMatch?'rolling 20 matches':'per '+p.bucket}</h2>
      <div class="xmode" role="group" aria-label="X axis"><button type="button" data-xmode="date" aria-pressed="${!byMatch}">By date</button><button type="button" data-xmode="match" aria-pressed="${byMatch}">By match (rolling 20)</button></div></div>
      ${byMatch&&state.xmode==='auto'?`<div class="muted" style="font-size:12px;margin:-4px 0 8px">Only ${withData} ${p.bucket}${withData===1?'':'s'} with matches here, so this shows a rolling average instead. Pick “By date” to see them.</div>`:''}
      ${lineChart(pts,m,{W:1000,H:300,marks:byMatch?[]:seasonMarks(p,bs),avg:m.get(s),maxDots:80})}
      <div class="ckey"><span><svg width="18" height="8"><line x1="0" x2="18" y1="4" y2="4" stroke="var(--ink2)" stroke-dasharray="2 3"/></svg>period average</span>
        ${byMatch?`<span>each point = your last 20 matches, so small days don't swing it</span>`:'<span>hollow dot = under 3 matches</span>'}</div></div>
    <div class="panel" style="margin-top:var(--s3)"><h2>Wins and losses · per ${p.bucket} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">· click a ${p.bucket} to ${p.bucket==='day'?'open its recap':'open it'}</span></h2>${wlChart(bs,{H:90,marks:seasonMarks(p,bs),open})}</div></div>`;
}

// ---------------- Variant C: calendar + drill-down table ----------------
// Levels: year → seasons|months → weeks → days → sessions. Rolling 7/30 are shortcuts to a day list.
const yearLvl = () => ({k:'year', label:'2026', from:YEAR0, to:TOMORROW});
function lvlOf(kind, off){ if(kind==='ytd'||kind==='all') return yearLvl(); const p=period(kind,off);
  return {k:kind==='week'||kind==='l7'||kind==='l30'?'days':kind==='month'?'month':'season', label:p.label, from:p.from, to:p.to, end:p.end, vs:p.vs, prev:p.prev}; }
function children(L){
  const clip = r => ({...r, to: r.to>TOMORROW?TOMORROW:r.to});
  if(L.k==='year') return state.group==='season'
    ? [{k:'pre',label:'Before S22',from:YEAR0,to:SEASONS[0].start}, ...SEASONS.map(s=>({k:'season',label:'Season '+s.n,from:s.start,to:s.end}))].map(clip).reverse()
    : Array.from({length:NOW.getMonth()+1},(_,i)=>clip({k:'month',label:monName(new Date(2026,i,1)),from:new Date(2026,i,1),to:new Date(2026,i+1,1)})).reverse();
  if(L.k==='season'||L.k==='month'||L.k==='pre'){ const out=[]; for(let d=monday(L.from); d<L.to; d=addD(d,7)) out.push(clip({k:'days',label:`Week ${isoWeek(d)} · ${fmtD(d)}`,from:d<L.from?L.from:d,to:addD(d,7)>L.to?L.to:addD(d,7)})); return out.reverse(); }
  if(L.k==='days'){ const out=[]; for(let d=L.from; d<L.to; d=addD(d,1)) out.push({k:'day',label:fmtDW(d),from:d,to:addD(d,1)}); return out.reverse(); }
  return [];
}
function calendar(L){
  const start=monday(YEAR0), weeks=Math.ceil((TOMORROW-start)/(7*864e5)), cs=13, gap=2, top=28, left=26;
  const cnt={}; FM.forEach(m=>{ const c=cnt[m.day]??={n:0,w:0}; c.n++; if(m.res==='W') c.w++; });
  // sequential: one hue (accent), more matches = stronger
  const lvl = n => n===0?0:n<=3?1:n<=6?2:n<=9?3:4, OP=[0,.25,.45,.7,1];
  let cells='', months='';
  for(let w=0; w<weeks; w++) for(let r=0; r<7; r++){ const d=addD(start,w*7+r); if(d<YEAR0||d>NOW) continue;
    const c=cnt[+d], inSel=d>=L.from&&d<L.to, n=c?c.n:0;
    cells += `<rect class="c" x="${left+w*(cs+gap)}" y="${top+r*(cs+gap)}" width="${cs}" height="${cs}" fill="${n?'var(--accent)':'var(--surf2)'}" fill-opacity="${n?OP[lvl(n)]*(inSel?1:.35):(inSel?1:.5)}"
      ${n?`data-day="${+d}"`:''} data-tip="${fmtDW(d)}: ${n?`${n} matches · ${c.w}–${n-c.w} · click to open the day`:'no matches'}"/>`;
    if(d.getDate()<=7 && r===0) months += `<text x="${left+w*(cs+gap)}" y="${top-6}">${monName(d).slice(0,3)}</text>`; }
  const seas = SEASONS.map(s=>{ const w=Math.floor((s.start-start)/(7*864e5)); return `<line x1="${left+w*(cs+gap)-1}" x2="${left+w*(cs+gap)-1}" y1="4" y2="${top+7*(cs+gap)}" stroke="var(--ink2)" stroke-dasharray="2 2"/><text x="${left+w*(cs+gap)+2}" y="10" style="fill:var(--ink2);font-weight:700">S${s.n}</text>`; }).join('');
  const days = ['Mon','','Wed','','Fri','',''].map((t,r)=>`<text x="0" y="${top+r*(cs+gap)+10}">${t}</text>`).join('');
  return `<div class="cal"><svg width="${left+weeks*(cs+gap)}" height="${top+7*(cs+gap)}" role="img" aria-label="Matches per day in 2026">${seas}${months}${days}${cells}</svg></div>
    <div class="ckey"><span>Fewer</span>${OP.slice(1).map(o=>`<svg width="12" height="12"><rect width="12" height="12" rx="2" fill="var(--accent)" fill-opacity="${o}"/></svg>`).join('')}<span>more matches per day</span>
      <span class="muted">· the bright part is the period you're in · click a day to open its recap</span></div>`;
}
function VariantC(){
  if(!state.lvl) state.lvl = ['ytd','all'].includes(state.kind) ? [yearLvl()] : [yearLvl(), lvlOf(state.kind,state.off)];
  const st=state.lvl, L=st[st.length-1];
  document.getElementById('pbar').innerHTML = `<div class="pnav"><nav class="crumbs" aria-label="Period">${st.map((x,i)=>i<st.length-1?`<button type="button" data-crumb="${i}">${x.label}</button><i>›</i>`:`<b aria-current="true">${x.label}</b>`).join('')}</nav>
    <div class="presets">${[['ytd','2026'],['l7','Last 7'],['l30','Last 30'],['week','This week']].map(([k,l])=>`<button type="button" data-jump="${k}">${l}</button>`).join('')}</div></div>`;
  const ms=inRange(L.from,L.to);
  const top=`<div class="wrap"><div class="panel" style="margin-top:var(--s4)">${calendar(L)}</div>`;
  if(!ms.length) return top+empty()+'</div>';
  const s=agg(ms);
  const rows=children(L).map(c=>({...c, s:agg(inRange(c.from,c.to))})).filter(c=>c.s.n);
  const win=MK('win'), cmp=(v,base,pts)=>v==null||base==null?'':(()=>{ const d=pts?v-base:100*(v-base)/base; return Math.abs(d)<(pts?5:10)?'':d>0?' <span class="up">▲</span>':' <span class="down">▼</span>'; })();
  const what = {year:state.group==='season'?'Seasons':'Months', season:'Weeks', month:'Weeks', pre:'Weeks', days:'Days'}[L.k];
  return `${top}
    <div class="hl"><div class="big num">${s.w}<i>–</i>${s.l}</div>
      <div><span>Win %</span><b class="num">${Math.round(s.winPct)}%</b></div><div><span>Matches</span><b class="num">${s.n}</b></div>
      <div><span>Sessions</span><b class="num">${s.sess}</b></div><div><span>Goals / game</span><b class="num">${f2(s.per('g'))}</b></div>
      <div><span>Saves / game</span><b class="num">${f2(s.per('sv'))}</b></div><div><span>Shooting</span><b class="num">${Math.round(s.shootPct)}%</b></div>
      <div><span>MVPs</span><b class="num">${s.mvp}</b></div></div>
    <div class="panel dt"><h2>${what}${L.k==='year'?`<span class="gtog"><button type="button" data-group="season" aria-pressed="${state.group==='season'}">Seasons</button><button type="button" data-group="month" aria-pressed="${state.group==='month'}">Months</button></span>`:''}
      <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px">▲▼ = clearly above / below ${L.label}'s own average · click a row to go in</span></h2>
      <div style="overflow-x:auto"><table class="num"><thead><tr><th>${what.replace(/s$/,'')}</th><th>Matches</th><th>W–L</th><th>Win %</th><th>Score/g</th><th>Goals/g</th><th>Saves/g</th><th>Shooting</th><th>MVPs</th></tr></thead>
      <tbody>${rows.map((c,i)=>`<tr ${c.k==='day'?`data-day="${+c.from}"`:`data-row="${i}"`} tabindex="0"><td>${c.label}${c.k==='day'?' <span class="muted">→ recap</span>':''}</td><td>${c.s.n}</td><td>${c.s.w}–${c.s.l}</td>
        <td>${Math.round(c.s.winPct)}%${cmp(c.s.winPct,s.winPct,true)}<span class="bar" aria-hidden="true"><i style="width:${c.s.winPct}%"></i></span></td>
        <td>${Math.round(c.s.per('score'))}</td><td>${f2(c.s.per('g'))}${cmp(c.s.per('g'),s.per('g'))}</td><td>${f2(c.s.per('sv'))}${cmp(c.s.per('sv'),s.per('sv'))}</td>
        <td>${Math.round(c.s.shootPct||0)}%${cmp(c.s.shootPct,s.shootPct,true)}</td><td>${c.s.mvp}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>${L.label}</td><td>${s.n}</td><td>${s.w}–${s.l}</td><td>${Math.round(s.winPct)}%</td><td>${Math.round(s.per('score'))}</td><td>${f2(s.per('g'))}</td><td>${f2(s.per('sv'))}</td><td>${Math.round(s.shootPct)}%</td><td>${s.mvp}</td></tr></tfoot></table></div>
      <div class="muted" style="font-size:12px;margin-top:8px">Bar: win % with a tick at 50%.</div></div>
    <div class="panel" style="margin-top:var(--s3)"><h2>Win % by ${what.replace(/s$/,'').toLowerCase()} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">oldest → newest</span></h2>
      ${lineChart(rows.slice().reverse().map(c=>({label:c.label, short:c.label.replace(/^Week \d+ · /,''), s:c.s})), win, {W:1000,H:160,avg:s.winPct})}</div></div>`;
}

// ---------------- switcher & events ----------------
const VARIANTS = [['A','Tabs + small multiples',VariantA],['B','Timeline + one big chart',VariantB],['C','Calendar + drill-down',VariantC]];
let vi = Math.max(0, VARIANTS.findIndex(v=>v[0]===P.get('variant')));
function render(){
  const [k,name,fn]=VARIANTS[vi];
  applyFilter();
  document.getElementById('app').innerHTML = fn();
  const p=period(state.kind,state.off); playlistUI(p.from,p.to); teammateUI(p.from,p.to);
  document.getElementById('vlabel').textContent = `${k} · ${name}`;
  const u=new URL(location.href); u.searchParams.set('variant',k); u.searchParams.set('period',state.kind); u.searchParams.set('off',state.off);
  u.searchParams.set('metric',state.metric); history.replaceState(null,'',u);
}
function go(d){ vi=(vi+d+VARIANTS.length)%VARIANTS.length; state.lvl=null; render(); }
document.getElementById('vprev').onclick=()=>go(-1);
document.getElementById('vnext').onclick=()=>go(1);
addEventListener('keydown',e=>{ if(e.target.closest('input,textarea,select,[contenteditable]')) return;
  if(e.key==='ArrowLeft') go(-1); if(e.key==='ArrowRight') go(1);
  if(e.key==='Enter' && e.target.matches('tr[data-row],tr[data-day]')) e.target.click(); });
document.getElementById('fPl').onchange=e=>{state.pl=e.target.value;render();};
document.getElementById('fTm').onchange=e=>{state.tm=e.target.value;render();};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-kind],[data-off],[data-metric],[data-xmode],[data-crumb],[data-jump],[data-row],[data-day],[data-group],[data-week]'); if(!t) return;
  const ds=t.dataset;
  if(ds.day){ location.href=RECAP; return; }               // a day → its recap (prototype: the recap's mock session)
  if(ds.week){ state.kind='week'; state.off=Math.round((monday(NOW)-new Date(+ds.week))/(7*864e5)); }
  if(ds.kind){ state.kind=ds.kind; state.off=+(ds.off||0); }
  else if(ds.off!=null) state.off=+ds.off;
  if(ds.metric) state.metric=ds.metric;
  if(ds.xmode) state.xmode=ds.xmode;
  if(ds.group) state.group=ds.group;
  if(ds.crumb) state.lvl=state.lvl.slice(0,+ds.crumb+1);
  if(ds.jump){ state.kind=ds.jump; state.off=0; state.lvl = ds.jump==='ytd' ? [yearLvl()] : [yearLvl(), lvlOf(ds.jump,0)]; }
  if(ds.row){ const L=state.lvl[state.lvl.length-1], c=children(L).filter(c=>inRange(c.from,c.to).length)[+ds.row]; state.lvl.push(c); }
  render();
});
const vt=document.getElementById('vtheme');
const applyTheme=()=>{ document.documentElement.dataset.theme=vt.value; };
vt.value = P.get('theme')==='daylight' ? 'daylight' : 'carbon'; vt.onchange=applyTheme; applyTheme();
const tip=document.getElementById('tip');
addEventListener('mousemove',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]');
  if(!el){tip.style.display='none';return;} tip.textContent=el.dataset.tip; tip.style.display='block';
  tip.style.left=Math.min(innerWidth-270,e.clientX+12)+'px'; tip.style.top=(e.clientY+14)+'px'; });
render();
</script>
</body>
